<div class="modal-header">
    <h4 class="modal-title pull-left">{{title}} - {{username}}</h4>
    <button class="pull-right btn-close close" type="button" (click)="bsModalRef.hide()">
        <span class="visually-hidden">&times;</span>
    </button>
</div>
<div class="modal-body">
    @for (role of availableRoles; track $index) {
        <div class="form-check">
            <input 
                type="checkbox" 
                class="form-check-input"
                value="role"
                (change)="updateSelectedRole(role)"
                [checked]="selectedRoles.includes(role)"    
                [disabled]="role === 'Admin' && username === 'admin' "
                title="edit user role"
            >
            <label>{{role}}</label>
        </div>
    }
</div>
<div class="modal-footer">
    <button
         [disabled]="selectedRoles.length === 0"
         class="btn btn-success" (click)="onSelectRoles()" type="button">Submit
    </button>
</div>
