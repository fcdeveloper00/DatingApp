<div>
    <button class="me-3 btn btn-outline-primary bg-light" (click)="get400Error()">Test 400 Error</button>
    <button class="me-3 btn btn-outline-primary bg-light" (click)="get401Error()">Test 401 Error</button>
    <button class="me-3 btn btn-outline-primary bg-light" (click)="get404Error()">Test 404 Error</button>
    <button class="me-3 btn btn-outline-primary bg-light" (click)="get500Error()">Test 500 Error</button>
    <button class="me-3 btn btn-outline-primary bg-light" (click)="get400ValidationError()">
        Test 400 Validation Error
    </button>

    @if(this.validationErrors.length > 0){

        <div class="row mt-5">
            <ul class="text-danger">
                @for (error of validationErrors; track $index) {
                    
                    <li>{{error}}</li>
                }
            </ul>
        </div>
    }




</div>
