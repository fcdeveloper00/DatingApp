<div class="form-floating mb-3">
  <input
    [class.is-invalid]="control.touched && this.control.invalid"
    [formControl]="control"
    class="form-control"
    placeholder="{{ label() }}"
    bsDatepicker
    [bsConfig]="bsConfig"
    [maxDate]="maxDate()"
  />
  <label>{{label()}}</label>
  <div
    class="invalid-feedback text-start"
    *ngIf="control.hasError('required')"
  >
    Please FILL the {{label()}} field
  </div>
  
  <div class="invalid-feedback"></div>
</div>
