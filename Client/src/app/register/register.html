<form [formGroup]="registerForm" (ngSubmit)="register()" autocomplete="off">
  <h2 class="text-center text-info">Sign Up</h2>
  <hr />
 
  <app-text-input
    [formControl]="$any(registerForm.controls['username'])"
    [label]="'Username'"
  >
  </app-text-input>

  <app-text-input
    [formControl]="$any(registerForm.controls['password'])"
    [label]="'password'"
    [type]="'password'"
  >
  </app-text-input>
  
  <app-text-input
    [formControl]="$any(registerForm.controls['confirmPassword'])"
    [label]="'Confirm Password'"
    [type]="'password'"
  >
  </app-text-input>
  <!-- <div class="mb-3">
    <label>Who is your favorite user?</label>
    <select class="form-select" title="select your choice">
        @for(user of usersFromHomeComponent();track $index){
            <option [value]="user.username">
                {{user.username}}
            </option>
        }
    </select>
  </div> -->

  <app-text-input
    [label]="'Known as'"
    [formControl]="$any(registerForm.controls['knownAs'])"
  >
  </app-text-input>

  <app-date-picker
    [formControl]="$any(registerForm.controls['dateOfBirth'])"
    [maxDate]="maxDate"
    [label]="'Date of birth'"
  >
  </app-date-picker>

  <div class="mb-3">
    <label style="margin-right: 10px;">I am a: </label>
    <label class="form-check-label">
      <input type="radio" class="form-check-input" value="female" formControlName="gender" title="Choose your gender">Female
      <input type="radio" class="form-check-input" value="male"   formControlName="gender" title="Choose your gender">Male
    </label>
  </div>

  <app-text-input
    [label]="'city'"
    [formControl]="$any(registerForm.controls['city'])"
  >
  </app-text-input>
  <app-text-input
    [label]="'Country'"
    [formControl]="$any(registerForm.controls['country'])"
  >
  </app-text-input>

  @if(validationErrors){

    <div class="alert alert-danger text-start">
      <ul>

        @for(error of validationErrors;track $index){
         <li>{{error}}</li> 
        }
      </ul>
    </div>
    
  }

  <div class="form-group text-center">
    <button [disabled]="!registerForm.valid" type="submit" class="btn btn-success btn-lg me-2">Register</button>
    <button type="button" class="btn btn-secondary btn-lg me-2" (click)="cancel()">Cancel</button>
  </div>
</form>
