<form #registerForm="ngForm" (ngSubmit)="register()" autocomplete="off">
  <h2 class="text-center text-info">Sign Up</h2>
  <hr />
  <div class="form-floating mb-3">
    <input
      name="username"
      [(ngModel)]="model.username"
      type="text"
      class="form-control"
      placeholder="Username"
    />
    <label>Username</label>
  </div>

  <!-- <div class="mb-3">
    <label>Who is your favorite user?</label>
    <select class="form-select" title="select you choice">
        @for(user of usersFromHomeComponent();track $index){
            <option [value]="user.username">
                {{user.username}}
            </option>
        }
    </select>
  </div> -->

  <div class="form-floating mb-3">
    <input
      name="password"
      [(ngModel)]="model.password"
      class="form-control"
      type="password"
      placeholder="Password"
    />
    <label>Password</label>
  </div>

  <div class="form-group text-center">
    <button type="submit" class="btn btn-success btn-lg me-2">Register</button>
    <button type="button" class="btn btn-secondary btn-lg me-2" (click)="cancel()">Cancel</button>
  </div>
</form>
